    <style>
      body {
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 20px;
        background-color: #121212;
        color: #fff;
      }
      .stations-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
      }
      .btn-station {
        background: none;
        border: 2px solid #333;
        border-radius: 12px;
        padding: 10px;
        cursor: pointer;
        transition: transform 0.2s;
        max-width: 250px;
      }
      .btn-station:hover {
        transform: scale(1.03);
      }
      .btn-station img {
        width: 100%;
        height: auto;
        border-radius: 8px;
        display: block;
      }

      .modal-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.85);
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }
      .modal-content {
        background: #1e1e1e;
        padding: 25px;
        border-radius: 15px;
        max-width: 650px;
        width: 90%;
        max-height: 85vh;
        overflow-y: auto;
        position: relative;
        box-shadow: 0 5px 20px rgba(0,0,0,0.5);
      }
      .close-btn {
        position: absolute;
        top: 10px;
        left: 15px;
        font-size: 24px;
        cursor: pointer;
        color: #aaa;
      }

      .sub-options {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-top: 20px;
        flex-wrap: wrap;
      }
      .sub-card {
        background: #2a2a2a;
        border: 1px solid #444;
        border-radius: 10px;
        padding: 10px;
        cursor: pointer;
        color: #fff;
        width: 140px;
        transition: background 0.2s;
      }
      .sub-card:hover {
        background: #007bff;
      }
      .sub-card img {
        width: 100%;
        border-radius: 6px;
        display: block;
        margin-bottom: 5px;
      }

      .text-box {
        background: #292929;
        border: 1px solid #007bff;
        border-radius: 10px;
        padding: 15px;
        margin-top: 15px;
        font-size: 1.05rem;
        line-height: 1.8;
        color: #ddd;
        text-align: right;
        white-space: pre-line;
      }
      .question-title {
        color: #ff4d4d;
        font-weight: bold;
        font-size: 1.15rem;
        margin-top: 20px;
        border-top: 1px dashed #555;
        padding-top: 15px;
        text-align: right;
        white-space: pre-line;

      function openStation(stationId) {
        const data = stationsData[stationId];
        if (!data) return;

        document.getElementById('modal-title').innerText = data.title;
        document.getElementById('text-display').style.display = 'none';
        document.getElementById('question-display').style.display = 'none';

        const container = document.getElementById('sub-options-container');
        container.innerHTML = "";

        data.subItems.forEach(item => {
          const card = document.createElement('div');
          card.className = 'sub-card';
          card.onclick = () => showContent(item.name, item.textContent, item.question);
          card.innerHTML = `<img src="${item.image}" alt="${item.name}"><span>${item.name}</span>`;
          container.appendChild(card);
        });

        document.getElementById('modal').style.display = 'flex';
      }

      function showContent(name, text, question) {
        document.getElementById('modal-title').innerText = name;
        const textDiv = document.getElementById('text-display');
        textDiv.innerText = text;
        textDiv.style.display = 'block';

        const qDiv = document.getElementById('question-display');
        qDiv.innerText = question;
        qDiv.style.display = 'block';
      }

      function closeModal() {
        document.getElementById('modal').style.display = 'none';
      }
    </script>
